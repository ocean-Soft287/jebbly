name: jeebly_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  dio: ^5.7.0
  flutter_bloc: ^9.0.0
  logger: ^2.5.0
  shared_preferences: ^2.4.0
  flutter_secure_storage: ^9.2.4
  json_annotation: ^4.9.0
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0
  internet_connection_checker: ^1.0.0+1
  go_router: ^14.7.1
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  device_preview: ^1.2.0
  flutter_spinkit: ^5.2.1
  flutter_native_splash: ^2.4.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  gap: ^3.0.1
  country_code_picker_plus: ^0.1.0+1
  google_maps_flutter: ^2.10.0
  location: ^8.0.0
  geocoding: ^3.0.0
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  dynamic_tabbar: ^1.0.9
  number_to_words_english: ^2.1.1
  number_to_word_arabic: ^0.0.8
  pinput: ^5.0.1
  restart_app: ^1.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/inter.ttc
        - asset: assets/fonts/inter/InterVariable.ttf
        - asset: assets/fonts/inter/InterVariable-Italic.ttf
