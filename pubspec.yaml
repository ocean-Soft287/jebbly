name: jeebly_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  dio: ^5.7.0
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  logger: ^2.5.0
  shared_preferences: ^2.4.0
  flutter_secure_storage: ^9.2.4
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  json_annotation: ^4.9.0
  retrofit: ^4.4.2
  pretty_dio_logger: ^1.4.0
  internet_connection_checker: ^1.0.0+1
  go_router: ^14.7.1
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  flutter_spinkit: ^5.2.1
  flutter_local_notifications: ^18.0.1
  flutter_native_splash: ^2.4.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  gap: ^3.0.1
  country_code_picker_plus: ^0.1.0+1
  google_maps_flutter: ^2.10.0
  location: ^8.0.0
  geocoding: ^3.0.0
  carousel_slider: ^5.0.0
  connectivity_plus: ^4.0.1
  file_picker: ^8.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  dynamic_tabbar: ^1.0.9
  number_to_words_english: ^2.1.1
  number_to_word_arabic: ^0.0.8
  internet_connection_checker_plus: ^2.0.0
  loading_animation_widget: ^1.3.0
  lottie: ^3.3.1
  pinput: ^5.0.1
  permission_handler: ^11.0.1
  shimmer: ^3.0.0
  restart_app: ^1.3.2
  url_launcher: ^6.3.1
  flutter_image_compress: ^2.4.0
  open_file: ^3.5.11
  # build_runner: ^2.11.1


dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: 
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Italic.ttf
          style: italic
